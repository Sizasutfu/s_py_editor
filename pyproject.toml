[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "s_py_editor"
version = "0.1.0"
description = "A terminal-based Python editor with a sidebar, loop runner, and more."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "prompt_toolkit>=3.0",
    "pygments>=2.0",
]

[project.scripts]
spy = "s_py_editor.__main__:main"